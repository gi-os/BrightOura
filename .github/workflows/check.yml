name: Check

# Compiles and tests without publishing anything.
#
# The point of this workflow is that a push to the default branch cuts a release, so the
# default branch is a bad place to find out that something doesn't compile. Any other branch
# runs this instead: the same build, minus the signing checks and the release.
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
        env:
          # GitHub Packages has no anonymous read, so resolving light-common needs a token.
          # GITHUB_ACTOR is on the runner already; GITHUB_TOKEN is not exported to steps and
          # has to be handed in. GPR_TOKEN takes precedence if a cross-repo PAT is ever needed:
          # a repo-scoped GITHUB_TOKEN's read access to another repository's package is not
          # guaranteed under a personal account.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile
        # Release too, not only debug. Debug is not minified, so a debug-only check cannot see
        # an R8 problem — and R8 is the part of this app most likely to break, since keep rules
        # fail at build time here and at runtime on the phone. No signing secret reaches a
        # branch build, so the release APK this produces is unsigned. That is the point: it is
        # compiled here and installed nowhere, and only build.yml on main signs anything.
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          # GitHub Packages has no anonymous read, so resolving light-common needs a token.
          # GITHUB_ACTOR is on the runner already; GITHUB_TOKEN is not exported to steps and
          # has to be handed in. GPR_TOKEN takes precedence if a cross-repo PAT is ever needed:
          # a repo-scoped GITHUB_TOKEN's read access to another repository's package is not
          # guaranteed under a personal account.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BrightOura-check-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
