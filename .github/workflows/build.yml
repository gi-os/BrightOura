name: Build & Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      # Docs only: deliberate, a README fix should not cut a release.
      - '**.md'
      - '.github/workflows/check.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # versionCode is the workflow run number, so every push produces a newer
      # build and `adb install -r` upgrades in place instead of erroring.
      - name: Stamp version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          BASE=$(grep 'versionName' app/build.gradle.kts | head -1 | sed -E 's/.*"([0-9]+\.[0-9]+).*"/\1/')
          VERSION="${BASE}.${RUN}"
          sed -i -E "s/versionCode = .*/versionCode = ${RUN}/" app/build.gradle.kts
          sed -i -E "s/versionName = \".*\"/versionName = \"${VERSION}\"/" app/build.gradle.kts
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          grep -E 'versionCode|versionName' app/build.gradle.kts

      # Absent, reports queue on the phone forever and nothing anywhere says so. This
      # repository has no REPORT_TOKEN secret today, so the annotation is the only
      # signal that shake-to-report is shipping dead. Set the secret to silence it.
      - name: Warn when the report token is missing
        env:
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
        run: |
          if [ -z "$REPORT_TOKEN" ]; then
            echo '::warning::REPORT_TOKEN is not set, so shake-to-report will queue reports on the phone and never post them. Set the REPORT_TOKEN repository secret.'
          fi

      # The signing key is a secret, not a file in the repo. Written here and nowhere
      # else; the path is gitignored so a local checkout cannot commit it back.
      - name: Restore signing keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > keystore/brightoura.jks
          # A missing or truncated secret would otherwise fall through to an unsigned
          # release that the fingerprint step rejects with a confusing message. Fail
          # here, where the cause is obvious.
          test -s keystore/brightoura.jks || { echo '::error::KEYSTORE_B64 is empty'; exit 1; }

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace
        env:
          # Shake-to-report posts issues with this. Absent, the build still works —
          # reports queue on the phone until a build that has the key installs over it.
          REPORT_TOKEN: ${{ secrets.REPORT_TOKEN }}
          # Unlocks the keystore restored above. Without it the release build is
          # unsigned and the fingerprint check below stops the release.
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          # Resolving light-common from GitHub Packages. See check.yml for why GITHUB_TOKEN
          # has to be passed explicitly and why GPR_TOKEN can override it.
          GPR_USER: ${{ secrets.GPR_USER }}
          GPR_TOKEN: ${{ secrets.GPR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect APK
        run: |
          V=${{ steps.ver.outputs.version }}
          mkdir -p out debugout
          cp app/build/outputs/apk/release/app-release.apk "out/BrightOura-v$V.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "debugout/BrightOura-v$V-debug.apk"
          ls -la out debugout

      # Android identifies an app by (packageName, signing cert). If the cert ever
      # changes, Obtainium updates fail with an opaque "Failure: Invalid", so pin it.
      - name: Verify signing certificate
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          ACTUAL=$("$APKSIGNER" verify --print-certs out/*.apk \
            | grep -i 'SHA-256 digest' | head -1 | sed -E 's/.*[Dd]igest:[[:space:]]*//' | tr -d ' ')
          EXPECTED=$(tr -d ' :\n' < signing-fingerprint.txt | tr 'A-F' 'a-f')
          echo "expected $EXPECTED"
          echo "actual   $ACTUAL"
          [ "$ACTUAL" = "$EXPECTED" ] || { echo '::error::signing certificate drifted'; exit 1; }

      # AGP shortens resource paths in release builds, so ic_launcher.png is renamed
      # to something like res/AB.png inside the zip. Ask the package what its icon is
      # instead of grepping filenames — this is the same lookup Obtainium and the
      # launcher do through PackageManager.
      - name: Verify launcher icon is present
        run: |
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging out/*.apk > badging.txt
          grep -E "^(application:|application-icon-)" badging.txt
          grep -qE "^application:.*icon='[^']+'" badging.txt \
            || { echo '::error::package declares no launcher icon'; exit 1; }

      - name: Upload release APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BrightOura-apk
          path: out/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: BrightOura-debug-apk
          path: debugout/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BrightOura v${{ steps.ver.outputs.version }}
          files: out/BrightOura-v${{ steps.ver.outputs.version }}.apk
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
          make_latest: true

      # Tell the index a release exists instead of waiting for its cron. GitHub
      # schedules are best-effort -- observed 70 minutes apart against a 15
      # minute schedule -- so without this a new release can sit uncatalogued
      # for over an hour and simply not appear as an update.
      - name: Ping the index
        if: success()
        continue-on-error: true
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.INDEX_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/gi-os/brightmarket-index/dispatches \
            -d "{\"event_type\":\"app-released\"}" \
          || echo "index ping failed; the hourly cron will pick this up"
